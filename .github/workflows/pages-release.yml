name: Publish documentation to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Pandoc and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended lmodern

      - name: Build report PDF
        working-directory: doc
        run: |
          pandoc report.md \
            -o report.pdf \
            --pdf-engine=xelatex \
            --resource-path=. \
            -V geometry:margin=2.5cm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble GitHub Pages site
        shell: bash
        run: |
          mkdir -p _site
          cp doc/report.pdf _site/report.pdf
          
          cat > _site/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="it">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Report</title>
            <style>
              html, body { height: 100%; margin: 0; }
              object { display: block; width: 100%; height: 100%; }
              p { font-family: sans-serif; padding: 1rem; }
            </style>
          </head>
          <body>
            <object data="report.pdf" type="application/pdf">
              <p>Anteprima non disponibile: <a href="report.pdf">apri il PDF</a>.</p>
            </object>
          </body>
          </html>
          EOF

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
