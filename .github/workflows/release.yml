name: release.yml
on:
  push:
    branches:
      - master

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install Pandoc and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended lmodern

      - name: Build report PDF
        working-directory: doc
        run: |
          pandoc report.md \
            -o report.pdf \
            --pdf-engine=xelatex \
            --resource-path=. \
            -V geometry:margin=2.5cm

      - name: Create ZIP
        run: zip -r "PCD-assigment-v${{ github.run_number }}.zip" src doc

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            PCD-assigment-v${{ github.run_number }}.zip
            doc/report.pdf